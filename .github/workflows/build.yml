name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk GTA6-Karten.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GTA6-Karten-APK
          path: GTA6-Karten.apk

      - name: Als Release veröffentlichen (direkter APK-Download am Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GTA 6 Karten – Build ${{ github.run_number }}
          files: GTA6-Karten.apk
