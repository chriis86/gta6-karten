plugins { id 'com.android.application' }
android {
    namespace 'de.chriis86.gta6karten'
    compileSdk 34
    defaultConfig {
        applicationId 'de.chriis86.gta6karten'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
